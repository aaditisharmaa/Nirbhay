services:
  - type: web
    name: nirbhay-safety-app
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npx vite build
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: SEED_DATA
        value: "false"
      - key: CLAUDE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
