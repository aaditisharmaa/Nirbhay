services:
  - type: web
    name: nirbhay-safety-app
    env: node
    buildCommand: npm install && npx vite build
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 10000
      - key: CLAUDE_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
